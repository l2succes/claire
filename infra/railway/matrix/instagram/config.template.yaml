# mautrix Instagram Configuration for Claire
# Documentation: https://docs.mau.fi/bridges/go/meta/config.html

# `network` replaced the legacy `meta` block. The current bridge exits while
# attempting to migrate the old block, which made the provisioning API time
# out before a user could authenticate.
network:
    mode: instagram
    displayname_template: '{{or .DisplayName .Username "Unknown user"}}'

homeserver:
    address: http://synapse:8008
    domain: claire.local

appservice:
    address: http://mautrix-instagram:29319
    hostname: 0.0.0.0
    port: 29319
    database:
        type: sqlite3-fk-wal
        uri: /data/mautrix-instagram.db
    id: instagram
    bot:
        username: metabot
        displayname: Instagram Bridge Bot
    as_token: __AS_TOKEN__
    hs_token: __HS_TOKEN__
    username_template: "meta_{{.}}"

bridge:
    displayname_template: "{{.Name}} (IG)"
    command_prefix: "!ig"

    permissions:
        "*": relay
        "claire.local": user
        "@claire_bot:claire.local": admin

    private_chat_portal_meta: true


# Double puppeting: allows the bridge to act as the real Matrix user so
# outgoing messages appear as their actual Matrix account rather than a ghost.
double_puppet:
    secrets:
        claire.local: "as_token:__DOUBLE_PUPPET_AS__"

provisioning:
    shared_secret: __PROVISIONING_SECRET__

logging:
    min_level: info
    writers:
        - type: stdout
          format: pretty-colored
