# mautrix Instagram Configuration for Claire
# Documentation: https://docs.mau.fi/bridges/go/meta/config.html

network:
    mode: instagram
    displayname_template: '{{or .DisplayName .Username "Unknown user"}}'

homeserver:
    address: http://synapse:8008
    domain: claire.local

appservice:
    address: http://mautrix-instagram:29319
    hostname: 0.0.0.0
    port: 29319
    id: instagram
    bot:
        username: metabot
        displayname: Instagram Bridge Bot
    as_token: GENERATE_ME_WITH_OPENSSL_RAND_HEX_32
    hs_token: GENERATE_ME_WITH_OPENSSL_RAND_HEX_32
    username_template: "meta_{{.}}"

database:
    type: sqlite3-fk-wal
    uri: /data/mautrix-instagram.db

bridge:
    displayname_template: "{{.Name}} (IG)"
    command_prefix: "!ig"

permissions:
    "*": relay
    "claire.local": user
    "@claire_bot:claire.local": admin

double_puppet:
    secrets:
        claire.local: "as_token:GENERATE_DOUBLE_PUPPET_AS_TOKEN"

provisioning:
    shared_secret: GENERATE_PROVISIONING_SHARED_SECRET

logging:
    min_level: info
    writers:
        - type: stdout
          format: pretty-colored
