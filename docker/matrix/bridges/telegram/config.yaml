# mautrix-telegram Configuration for Claire
# Documentation: https://docs.mau.fi/bridges/python/telegram/config.html

homeserver:
    address: http://synapse:8008
    domain: claire.local

appservice:
    address: http://mautrix-telegram:29317
    hostname: 0.0.0.0
    port: 29317
    database:
        type: sqlite3-fk-wal
        uri: /data/mautrix-telegram.db
    id: telegram
    bot:
        username: telegrambot
        displayname: Telegram Bridge Bot
        avatar: mxc://maunium.net/tJCRmUyJDsgRNgqhOgoJMuOY
    as_token: GENERATE_ME_WITH_OPENSSL_RAND_HEX_32
    hs_token: GENERATE_ME_WITH_OPENSSL_RAND_HEX_32

telegram:
    # Get from https://my.telegram.org/apps
    api_id: YOUR_TELEGRAM_API_ID
    api_hash: YOUR_TELEGRAM_API_HASH
    # Optional: bot token for relay mode
    bot_token: ""

bridge:
    username_template: "_telegram_{{.}}"
    # Prefer Telegram's profile name, then its @username. `.Name` is not a
    # current mautrix-telegram profile field, which can leave Claire with an
    # opaque identifier instead of the name Telegram provides.
    displayname_template: '{{if .Deleted}}Deleted account {{.UserID}}{{else}}{{or .FullName .Username "Telegram user"}}{{end}} (TG)'
    command_prefix: "!tg"

    permissions:
        "*": relay
        "claire.local": user
        "@claire_bot:claire.local": admin

    relay_user_distinguishers: []
    animated_sticker:
        target: webp
        convert_from_webm: true

    # Double puppeting: allows the bridge to act as the real Matrix user
    # so outgoing messages from the user's Telegram account appear as their
    # actual Matrix account instead of a ghost user (_telegram_<id>:claire.local).
    # Docs: https://docs.mau.fi/bridges/general/double-puppeting.html
    double_puppet:
        secrets:
            claire.local: "as_token:GENERATE_DOUBLE_PUPPET_AS_TOKEN"

logging:
    min_level: info
    writers:
        - type: stdout
          format: pretty-colored
