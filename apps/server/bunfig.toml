# Server-specific Bun configuration

[test]
# Test configuration for server.
# Scan the whole project (not just ./tests) so colocated src/**/*.test.ts files
# — e.g. the WhatsApp pairing + Matrix converter suites — are gated in CI too.
# (bun excludes node_modules by default.)
root = "."
coverage = true
# NOTE: coverage is reported but not enforced. The codebase currently sits ~50%;
# a hard 0.7 threshold failed `bun test` (exit 1) even with all tests passing and
# blocked CI. Re-introduce a realistic, ratcheting threshold as coverage grows.
envFile = ".env.test"

# Development settings
[dev]
# Port for the dev server
port = 3001
