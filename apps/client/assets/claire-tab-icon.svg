    <g transform="translate(64 0) scale(-1 1)">
      <path d="M10 34c0-13 9-22 22-22s22 8 22 20-9 20-21 20c-10 0-17-6-17-14 0-7 5-12 12-12 6 0 10 4 10 9 0 6-4 10-10 10" fill="none" stroke="#10120F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="34" r="4" fill="#FFFDF8"/>
    </g>
  </g>
</svg>
