<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 24pt square at 1×; generated @2x/@3x variants preserve that logical
       size for UIKit instead of presenting the original 96px file as 96pt. -->
