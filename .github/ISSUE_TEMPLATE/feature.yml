name: Feature request
description: Propose a change to Claire
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mobile
        - desktop
        - server
        - website
        - docs
        - plugins
        - connectors
        - design-system
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
