name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # tim-actions/dco takes the commit list as an input; it has no way to
      # derive one itself. `commits-from-origin` was never a valid input, so
      # the action received nothing and died on "Unexpected end of JSON input"
      # for every PR regardless of whether the commits were signed off.
      - name: Get PR commits
        id: get-pr-commits
        uses: tim-actions/get-pr-commits@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check DCO sign-off
        uses: tim-actions/dco@master
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
