name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # whatsapp-web.js depends on puppeteer, which by default downloads Chromium
  # (~150MB) on install and was hanging/timing out CI. Tests mock puppeteer, so
  # skip the download entirely. (Both var names cover old + new puppeteer.)
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Run both suites even if one fails, so we see the full picture.
      fail-fast: false
      matrix:
        include:
          - name: Server Tests
            working-directory: ./apps/server
            # Server tests use bun's test runner (bun:test / mock.module).
            test-command: bun test
          - name: Mobile Tests
            working-directory: ./apps/client
            # Mobile tests use jest (bun test can't parse React Native's Flow syntax).
            test-command: bunx jest --coverage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Run tests
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.test-command }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.working-directory }}/coverage
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run typecheck

  e2e:
    name: Mock end-to-end tests
    runs-on: ubuntu-latest
    # Keep the advisory suite from occupying a runner for GitHub's six-hour
    # default when Expo or Playwright becomes stuck during startup.
    timeout-minutes: 15
    # The suite boots the app and signs in, but 41 of 59 tests still assert
    # against selectors the redesigned inbox no longer renders. Non-blocking
    # until those are rewritten: https://github.com/l2succes/claire/issues/145
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install client dependencies
        working-directory: ./apps/client
        run: bun install

      - name: Install Playwright Chromium
        working-directory: ./apps/client
        run: bunx playwright install --with-deps chromium

      - name: Run mock end-to-end tests
        working-directory: ./apps/client
        env:
          MOCK_BRIDGE: "true"
        run: bunx playwright test

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Build server
        working-directory: ./apps/server
        run: bun run build

      - name: Build client for web
        working-directory: ./apps/client
        run: bunx expo export -p web

      - name: Build website and public documentation
        working-directory: ./apps/website
        run: bun run build
