name: CI

on:
  push:
    branches: [main, develop]
  # Stacked pull requests need the same checks before their parent is merged.
  pull_request:

env:
  # whatsapp-web.js depends on puppeteer, which by default downloads Chromium
  # (~150MB) on install and was hanging/timing out CI. Tests mock puppeteer, so
  # skip the download entirely. (Both var names cover old + new puppeteer.)
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Run both suites even if one fails, so we see the full picture.
      fail-fast: false
      matrix:
        include:
          - name: Server Tests
            working-directory: ./apps/server
            # Server tests use bun's test runner (bun:test / mock.module).
            test-command: bun test
          - name: Mobile Tests
            working-directory: ./apps/client
            # Mobile tests use jest (bun test can't parse React Native's Flow syntax).
            test-command: bunx jest --coverage

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Run tests
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.test-command }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.working-directory }}/coverage
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run typecheck

  e2e:
    name: Mock end-to-end tests
    runs-on: ubuntu-24.04
    # Match bun.lock's Playwright version. Preinstalled browsers and OS/fonts
    # avoid slow apt mirrors consuming the job budget before tests even start.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    # Keep the suite from occupying a runner for GitHub's six-hour
    # default when Expo or Playwright becomes stuck during startup.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        # The Playwright image has npm but no unzip (required by setup-bun).
        # Use Bun's npm distribution without installing any OS packages.
        timeout-minutes: 2
        run: npm install --global bun@1.4.4

      - name: Install client dependencies
        working-directory: ./apps/client
        run: bun install

      - name: Verify preinstalled Chromium
        timeout-minutes: 1
        working-directory: ./apps/client
        # Fail before the suite if a dependency bump no longer matches the
        # image, or if the browser cannot launch with its bundled OS libraries.
        run: bun -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();'

      - name: Run mock end-to-end tests
        working-directory: ./apps/client
        env:
          MOCK_BRIDGE: "true"
        run: bunx playwright test

      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mock-e2e-failure-traces
          path: apps/client/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mock screen tour
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mock-e2e-screen-tour
          path: /tmp/claire-tour
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, e2e]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd apps/server && bun install
          cd ../client && bun install

      - name: Build server
        working-directory: ./apps/server
        run: bun run build

      - name: Build client for web
        working-directory: ./apps/client
        run: bunx expo export -p web

      - name: Build website and public documentation
        working-directory: ./apps/website
        run: bun run build
